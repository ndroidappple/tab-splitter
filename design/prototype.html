<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Design prototype for design/ui-plan.md. Not served by the app (Netlify publishes public/ only). -->
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Tab Splitter Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  /* Layout: one thermal-receipt strip on a slate ground, a tear-off total stub docked under it; sheets are paper too. */
  --ground:#E1E5EA; --paper:#FFFFFF; --field:#EEF1F4; --ink:#15171C; --muted:#5A606E; --rule:#D4D9E0; --dots:#AAB1BD;
  --warn:#B3261E; --warn-soft:#FBE5E2; --ok:#17703F; --ok-soft:#DDF0E4; --tweak:#8A5A00; --tweak-soft:#FBF0D9;
  --btn:#15171C; --btn-ink:#FFFFFF; --scrim:rgba(12,14,18,.46); --lift:rgba(20,24,32,.13);
  --me:#2F5BD3; --hl:34%;
  --ui:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --safe-b:env(safe-area-inset-bottom, 0px); --safe-t:env(safe-area-inset-top, 0px);
  /* Springs: lib/motion.js in GymBuddy, rebuilt in script below; these are the pre-script fallbacks. */
  --enter:cubic-bezier(.16,1,.3,1); --enter-ms:375ms; --pop:cubic-bezier(.2,1.5,.4,1); --pop-ms:486ms;
  --slide:cubic-bezier(.3,1.3,.5,1); --slide-ms:371ms; --surface:cubic-bezier(.2,1,.3,1); --surface-ms:486ms;
  --exit:cubic-bezier(.4,0,1,1); --exit-ms:200ms; --slow:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D0F13; --paper:#1A1D23; --field:#252930; --ink:#EDEFF3; --muted:#A1A7B4; --rule:#2E333C; --dots:#4E5562;
    --warn:#F2867C; --warn-soft:#3A1F1C; --ok:#5ACB8E; --ok-soft:#163027; --tweak:#F0C064; --tweak-soft:#33280F;
    --btn:#EDEFF3; --btn-ink:#0D0F13; --scrim:rgba(0,0,0,.62); --lift:rgba(0,0,0,.45); --hl:46%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0D0F13; --paper:#1A1D23; --field:#252930; --ink:#EDEFF3; --muted:#A1A7B4; --rule:#2E333C; --dots:#4E5562;
  --warn:#F2867C; --warn-soft:#3A1F1C; --ok:#5ACB8E; --ok-soft:#163027; --tweak:#F0C064; --tweak-soft:#33280F;
  --btn:#EDEFF3; --btn-ink:#0D0F13; --scrim:rgba(0,0,0,.62); --lift:rgba(0,0,0,.45); --hl:46%;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
html.sheet-open{overflow:hidden}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.45 var(--ui);font-optical-sizing:auto;-webkit-font-smoothing:antialiased;padding-bottom:calc(36px + var(--safe-b))}
body.has-dock{padding-bottom:calc(140px + var(--safe-b))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--me);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.money,.price,.big{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- Prototype bar (not part of the design) ---------- */
.proto{background:var(--ink);color:var(--paper);view-transition-name:proto}
.proto-in{max-width:560px;margin:0 auto;padding-block:7px;padding-left:var(--gut-l);padding-right:var(--gut-r);display:flex;align-items:center;gap:6px}
.proto-in > b{margin-right:auto;font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.pt{min-height:32px;padding:0 11px;border-radius:999px;border:1px solid color-mix(in srgb,var(--paper) 32%,transparent);background:transparent;color:inherit;font-weight:650;font-size:13px;white-space:nowrap}
.pt[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.pt.go{background:var(--me);border-color:var(--me);color:#fff}

/* ---------- Header ---------- */
.top{position:sticky;top:var(--safe-t);z-index:5;background:var(--ground);view-transition-name:top}
.top-in{max-width:560px;margin:0 auto;padding-block:10px;padding-left:var(--gut-l);padding-right:var(--gut-r);display:flex;align-items:center;gap:12px;min-height:60px}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.brand strong{font-size:19px;font-weight:750;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand span{font-size:13px;color:var(--muted);font-family:var(--mono);letter-spacing:-.01em}
.chip-btn{display:inline-flex;align-items:center;gap:8px;max-width:52%;border:0;background:var(--paper);border-radius:999px;padding:4px 13px 4px 4px;min-height:40px;font-weight:650;font-size:14.5px;box-shadow:0 1px 2px var(--lift)}
.chip-btn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.wrap{max-width:560px;margin:0 auto;padding-block:4px 0;padding-left:var(--gut-l);padding-right:var(--gut-r)}
h1{font-size:32px;font-weight:800;line-height:1.08;letter-spacing:-.03em;margin:10px 0 8px;text-wrap:balance}
.h2{font-size:18px;font-weight:750;margin:22px 0 8px;letter-spacing:-.01em}
.lede{color:var(--muted);margin:0 0 20px;font-size:16.5px;max-width:38ch}
.note{color:var(--muted);font-size:14px;margin:6px 2px 0}
.stack{display:flex;flex-direction:column;gap:10px}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2 > *{flex:1 1 140px;min-width:0}
.row2.tight > .btn{flex:0 0 auto}

/* ---------- Controls ---------- */
.btn{min-height:52px;padding:0 20px;border-radius:14px;border:0;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:16.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none}
.btn.wide{width:100%}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--rule)}
.btn.sm{min-height:40px;padding:0 13px;font-size:14.5px;border-radius:11px}
.btn:disabled{opacity:.45}
.link{background:none;border:0;color:var(--me);font-weight:650;padding:10px 2px;text-decoration:underline;text-underline-offset:3px}
/* Presses (GymBuddy's press rule): down in 70 ms, back on the pop spring. Rows shade instead. */
.btn,.tick,.slot,.name-btn,.chip-btn,.pt,.vote button,.choice,.step button,.chip button,.x{transition:transform var(--pop-ms) var(--pop),background-color 140ms,color 140ms,box-shadow 140ms,border-color 140ms}
:is(.btn,.tick,.slot,.name-btn,.chip-btn,.pt,.vote button,.step button,.chip button,.x):active:not(:disabled){transform:scale(.94);transition-duration:calc(70ms * var(--slow));transition-timing-function:ease-out}
:is(.btn,.choice,.name-btn):active:not(:disabled){transform:scale(.975)}
.l-main,.pc-head{transition:background-color 180ms}
.l-main:active,.pc-head:active{background:color-mix(in srgb,var(--ink) 6%,transparent);transition-duration:calc(60ms * var(--slow))}

label.f{display:block;font-weight:650;font-size:14.5px;margin:14px 0 6px}
.in{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--rule);background:var(--paper);padding:0 12px;font-size:16px}
.in.money{text-align:right}
textarea.in{padding:10px 12px;min-height:72px;resize:vertical}
.ie-head,.ie{display:grid;grid-template-columns:minmax(0,1fr) 52px 88px 40px;gap:6px;align-items:center}
.ie-head{font-size:12.5px;color:var(--muted);font-weight:600;padding:0 2px 4px}
.items-edit{display:flex;flex-direction:column;gap:8px}
.ie .in{min-height:44px;padding:0 8px}
.x{width:40px;height:44px;border:0;background:none;color:var(--muted);font-size:22px;border-radius:10px}
.banner{border-radius:12px;padding:10px 12px;font-size:14.5px;font-weight:600;margin:12px 0 0;background:var(--field)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.once-pop{animation:pop var(--pop-ms) var(--pop) both}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--rule);border-radius:999px;padding:3px 3px 3px 13px;font-weight:600;font-size:15px}
.chip button{border:0;background:none;width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:18px}
.chip.once-pop{animation:pop var(--pop-ms) var(--pop) both}
.choice{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--rule);margin-bottom:8px;cursor:pointer}
.choice:has(input:checked){box-shadow:inset 0 0 0 2px var(--ink)}
.choice input{accent-color:var(--ink);width:20px;height:20px;margin:2px 0 0;flex:none}
.choice b{display:block}
.choice span span{color:var(--muted);font-size:14px}
.sh-foot{display:flex;flex-direction:column;gap:8px;margin-top:18px}

.av{width:28px;height:28px;border-radius:50%;background:var(--pc);color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.av.lg{width:42px;height:42px;font-size:18px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:18px}
.name-btn{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 9px;border:0;background:var(--paper);border-radius:14px;text-align:left;min-height:62px;font-weight:700;font-size:16.5px;box-shadow:0 1px 2px var(--lift)}

/* ---------- People / Items switch: GymBuddy's tab pill, sliding on the slide spring ---------- */
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;margin:4px 0 6px;border-radius:13px;background:color-mix(in srgb,var(--ink) 8%,var(--ground));view-transition-name:seg}
.seg-pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 4.5px);border-radius:10px;background:var(--paper);box-shadow:0 1px 2px var(--lift);transform:translateX(calc(var(--i,1) * (100% + 3px)));transition:transform var(--slide-ms) var(--slide)}
.seg button{position:relative;z-index:1;min-height:40px;border:0;background:transparent;border-radius:10px;font-weight:650;font-size:15px;color:var(--muted);transition:color 140ms}
.seg button[aria-selected="true"]{color:var(--ink)}

/* ---------- The receipt ---------- */
.receipt{position:relative;background:var(--paper);margin:20px 0 28px;padding:14px 0 8px}
.receipt::before,.receipt::after,.pic::after,.stub::before{content:"";position:absolute;left:0;right:0;height:10px;background-size:12px 10px;background-repeat:repeat-x}
.receipt::before,.stub::before{top:-9px;background-image:linear-gradient(to top right,var(--paper) 50%,transparent 50%),linear-gradient(to top left,var(--paper) 50%,transparent 50%)}
.receipt::after,.pic::after{bottom:-9px;background-image:linear-gradient(to bottom right,var(--paper) 50%,transparent 50%),linear-gradient(to bottom left,var(--paper) 50%,transparent 50%)}
.r-head{padding:4px 18px 14px;text-align:center;font-family:var(--mono);font-size:12.5px;color:var(--muted);line-height:1.55;border-bottom:1.5px dashed var(--rule)}
.r-head b{display:block;font-size:15px;font-weight:600;letter-spacing:.16em;color:var(--ink);margin-bottom:2px}
.sect{display:flex;align-items:center;gap:8px;padding:18px 18px 4px;font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sect::after{content:"";flex:1;border-bottom:1.5px dashed var(--rule)}
.sect.plain{padding:20px 4px 8px}
.sect.plain::after{display:none}
.count{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:0;border-radius:999px;padding:1px 8px;background:var(--field);color:var(--ink)}
.count.warn{background:var(--warn-soft);color:var(--warn)}
.count.ok{background:var(--ok-soft);color:var(--ok)}
.line{display:flex;align-items:center;gap:2px;padding-right:12px;position:relative;--hlc:color-mix(in srgb,var(--me) var(--hl),transparent)}
.line.slotted{flex-direction:column;align-items:stretch;gap:0;padding-right:0}
.l-row{display:flex;padding-right:12px}
.l-main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:10px 6px 10px 18px;display:flex;flex-direction:column;gap:3px;border-radius:0 12px 12px 0}
.l-top{display:flex;align-items:baseline}
.l-name{font-weight:620;font-size:16.5px;line-height:1.3;min-width:0}
.qty{font-family:var(--mono);font-size:14px;color:var(--muted);font-weight:500}
/* The highlighter: what you had gets a swipe in your color. Background-size so it follows wrapped lines. */
.hl{background-image:linear-gradient(var(--hlc),var(--hlc));background-repeat:no-repeat;background-position:0 90%;background-size:0% .8em;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .14em;margin:0 -.14em;border-radius:.2em}
.mine .hl{background-size:100% .8em}
.once-draw .hl{animation:hl-draw var(--slide-ms) var(--slide) both}
.once-erase .hl{animation:hl-erase var(--exit-ms) var(--exit) both}
.lead{flex:1;min-width:14px;border-bottom:2px dotted var(--dots);margin:0 8px;transform:translateY(-.32em)}
.price{font-size:15px;font-weight:500;white-space:nowrap}
.price small{font-size:12px;color:var(--muted)}
.l-meta{display:flex;flex-wrap:wrap;align-items:center;gap:3px 10px;font-size:13.5px;color:var(--muted)}
.l-meta .warn{color:var(--warn);font-weight:650}
.who{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.dots{display:inline-flex}
.dots .av{width:19px;height:19px;font-size:10px;box-shadow:0 0 0 2px var(--paper)}
.dots .av + .av{margin-left:-5px}
.yours{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink)}
.tick{width:44px;height:44px;flex:none;border-radius:50%;border:2px solid var(--rule);background:transparent;color:transparent;display:grid;place-items:center;padding:0}
.tick[aria-pressed="true"]{background:var(--me);border-color:var(--me);color:#fff}
.once-draw .tick svg,.tick.once-pop svg{animation:pop var(--pop-ms) var(--pop) both}
.once-remote{animation:remote calc(1100ms * var(--slow)) ease-out}
.slots{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 12px}
.slot{width:40px;height:40px;border-radius:50%;padding:0;border:0;font-weight:700;font-size:15px;display:grid;place-items:center}
.slot.open{border:2px dashed var(--dots);background:transparent;color:var(--muted);font-size:20px;font-weight:500}
.slot.taken{background:var(--pc);color:#fff;opacity:.62}
.slot.mine{background:var(--pc);color:#fff;box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--pc)}
.slot.shared{font-size:12px;letter-spacing:-.02em}
.slot.once-pop{animation:pop var(--pop-ms) var(--pop) both}
.r-foot{margin-top:12px;padding:14px 18px 8px;border-top:1.5px dashed var(--rule);font-family:var(--mono);font-size:13.5px;color:var(--muted)}
.lr{display:flex;align-items:baseline;padding:2px 0}
.lr.tot{color:var(--ink);font-weight:600;font-size:15px;padding-top:6px}
.thanks{text-align:center;letter-spacing:.24em;font-size:11.5px;padding-top:14px}

/* ---------- People panel ---------- */
.card{background:var(--paper);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.sum{margin-top:16px}
.sum-row{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.big{font-size:30px;font-weight:600;letter-spacing:-.03em}
.bar{height:8px;border-radius:99px;background:var(--field);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transform-origin:left}
.attn h3{margin:0 0 4px;font-size:16px;font-weight:700}
.attn h3 .money{color:var(--warn)}
.mini{list-style:none;padding:0;margin:8px 0 0;font-family:var(--mono);font-size:13.5px}
.mini li{display:flex;align-items:baseline;padding:3px 0}
.mini li.muted{color:var(--muted)}
.mini.open li{align-items:center;font-family:var(--ui);font-size:15px;font-weight:600}
.mini.open .lead{transform:none}
.mini.open li > span:first-child{min-width:0}
.mini.open .btn{flex:none;white-space:nowrap}
.pcard{padding:2px 4px;margin-bottom:8px}
.pc-head{width:100%;border:0;background:none;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 10px;border-radius:12px;min-height:60px}
.p-name{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.p-name b{font-weight:680;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-name small{font-size:13.5px;color:var(--muted)}
.p-name small.due{color:var(--warn);font-weight:650}
.p-name small.done{color:var(--ok);font-weight:650}
.pc-total{font-family:var(--mono);font-weight:600;font-size:17px}
.chev{flex:none;color:var(--muted);transition:transform var(--slide-ms) var(--slide)}
.pcard.open .chev{transform:rotate(180deg)}
.pc-body{padding:0 10px 12px 48px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acts.flat{margin-top:0}

/* ---------- The PAID stamp ---------- */
.stamp{display:inline-block;font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--ok);border:2.5px solid currentColor;border-radius:6px;padding:1px 6px 0 8px;transform:rotate(-8deg);line-height:1.35;vertical-align:middle}
.stamp.sm{font-size:11.5px;border-width:2px;padding:0 4px 0 6px}
.stamp.once-stamp{animation:stamp-in var(--pop-ms) var(--pop) both}

/* ---------- The tear-off total (dock) ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;view-transition-name:dock;filter:drop-shadow(0 -3px 10px var(--lift))}
.dock.once-dockin{animation:dock-in var(--surface-ms) var(--surface) both}
.dock.leaving{animation:dock-out var(--exit-ms) var(--exit) both;pointer-events:none}
.stub{position:relative;background:var(--paper)}
.dock-in{max-width:560px;margin:0 auto;padding-block:12px calc(12px + var(--safe-b));padding-left:var(--gut-l);padding-right:var(--gut-r);display:flex;align-items:center;gap:12px}
.dock-sum{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.dock-sum strong{font-family:var(--mono);font-size:28px;font-weight:600;letter-spacing:-.03em;margin:3px 0 2px;display:flex;align-items:center;gap:12px;white-space:nowrap}
.dock-sum small{font-size:13px;color:var(--muted)}

/* ---------- Rolling numbers (GymBuddy's Roll.jsx) ---------- */
.roll{white-space:nowrap}
.rd{position:relative;display:inline-block;white-space:pre}
.ri{display:inline-block;animation:roll-in var(--enter-ms) var(--enter) calc(30ms * var(--slow)) both}
.ro{position:absolute;left:0;top:0;animation:roll-out calc(140ms * var(--slow)) ease-out forwards}

/* ---------- Start: the receipt being read ---------- */
.pic{position:relative;width:148px;margin:6px auto 30px;background:var(--paper);padding:14px 12px 12px;transform:rotate(-3deg);box-shadow:0 12px 28px var(--lift);view-transition-name:receipt-pic}
.pic.big{width:196px;transform:none;margin-bottom:26px}
.pic i{display:block;height:5px;border-radius:3px;background:var(--rule);margin:7px 0}
.pic i.c{width:56%;margin:0 auto 10px;height:7px;background:var(--ink);opacity:.75}
.pic i.t{background:var(--ink);opacity:.75;margin-top:12px}
.scanline{position:absolute;left:-8px;right:-8px;top:0;height:2px;border-radius:2px;background:var(--me);box-shadow:0 0 14px 3px color-mix(in srgb,var(--me) 55%,transparent);animation:scan calc(1300ms * var(--slow)) ease-in-out infinite alternate}
.read{list-style:none;padding:0;margin:0;font-family:var(--mono);font-size:14px}
.read li{display:flex;align-items:baseline;padding:4px 0}
.read li.once-read{animation:read-in var(--enter-ms) var(--enter) both}
.cascade > *{animation:view-in var(--enter-ms) var(--enter) both}
.cascade > :nth-child(2){animation-delay:calc(30ms * var(--slow))}
.cascade > :nth-child(3){animation-delay:calc(60ms * var(--slow))}
.cascade > :nth-child(4){animation-delay:calc(90ms * var(--slow))}
.cascade > :nth-child(5){animation-delay:calc(120ms * var(--slow))}
.cascade > :nth-child(n+6){animation-delay:calc(150ms * var(--slow))}

function compute() {
  const sub = T.items.reduce((s, it) => s + it.cents, 0) || 1;
  const extras = T.charge - sub;
  const by = {}, info = {}, openItems = [];
  for (const id of T.order) by[id] = { id, p: T.people[id], items: 0, lines: [] };
  let poolItems = 0;
  for (const it of T.items) {
    const unit = it.cents / it.qty, share = {}, holders = [];
    let left = 0;
    for (const sl of it.slots) {

      for (const p of sl) { share[p] = (share[p] || 0) + unit / sl.length; if (!holders.includes(p)) holders.push(p); }
    }
    info[it.id] = { left, share, holders, unit };
    if (left) { poolItems += left * unit; openItems.push(it); }
    for (const [p, amt] of Object.entries(share)) {
      if (!by[p]) continue;
      const n = it.slots.filter((sl) => sl.includes(p)).length;
      const shared = it.slots.some((sl) => sl.includes(p) && sl.length > 1);
      by[p].items += amt;
      by[p].lines.push({ label: (n > 1 ? `${n} × ` : '') + it.name + (shared ? ' (shared)' : ''), amt });
    }
  }
  const pool = Math.round(poolItems + (extras * poolItems) / sub);
  for (const r of Object.values(by)) {
    r.extras = Math.round((extras * r.items) / sub);
    r.total = Math.round(r.items) + r.extras;
  }
  const others = T.order.filter((id) => id !== HOST);
  if (T.pool === 'spread' && pool > 0) {
    const unpaid = others.filter((id) => T.people[id].paid == null && by[id].total > 0);

    unpaid.forEach((id) => { by[id].total += each; by[id].lines.push({ label: 'Share of unclaimed items', amt: each }); });
  }
  for (const r of Object.values(by)) {
    r.paid = r.p.paid || 0;
    r.owed = Math.max(0, r.total - r.paid);
    r.settled = r.p.paid != null && r.owed <= 1;
  }
  const expected = Math.max(0, T.charge - (by[HOST] ? by[HOST].total : 0));
  const collected = others.reduce((s, id) => s + (by[id].paid || 0), 0);
  return { by, info, openItems, pool, sub, extras, expected, collected };
}

/* Drag down to close: from the grab bar and header, or from the content when it's scrolled to the top.
   Far (140 px or 35%) or fast (0.5 px/ms) closes from where the finger let go; otherwise it springs back. */
(function dragToClose() {
  const START = 8, FAR = 140, FLICK = 0.5;
  let g = null;
  const settle = () => {
    const at = panel.style.transform;
    panel.style.transform = ''; scrim.style.opacity = '';
    if (at && !still()) panel.animate([{ transform: at }, { transform: 'translateY(0)' }], { duration: dur('surface'), easing: ease('surface') });
  };
  panel.addEventListener('touchstart', (e) => {
    g = null;
    if (e.touches.length !== 1 || closing) return;
    const t = e.target;
    if (t.closest('input, textarea, select')) return;
    for (let el = t; el && el !== panel; el = el.parentElement) if (el.scrollTop > 0) return;
    const p = e.touches[0];
    g = { x: p.clientX, y: p.clientY, dy: 0, on: null, trail: [] };

    if (!g || g.on === false) return;
    const p = e.touches[0];
    if (g.on === null) {

      if (Math.hypot(dx, dy) < START) return;
      g.on = dy > 0 && dy > Math.abs(dx);
      if (!g.on) return;
      g.y += START;
      panel.classList.add('dragging');
    }
    e.preventDefault();
    g.dy = Math.max(0, p.clientY - g.y);

/* =====================================================================
   Toast: a small pill that rises over the dock. Tap it or swipe it away;
   Undo is plain text. Undo toasts stay 5 s, plain ones 2.6 s.
   ===================================================================== */
let toastEl = null, toastT = null;
function toast(msg, opts = {}) {
  const host = dlg.open && !closing ? dlg : document.body, root = $('#toasts');
  if (root.parentNode !== host) host.appendChild(root);
  if (toastEl) dismissToast(toastEl);
  const el = document.createElement('div');
  el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = `<span class="msg">${esc(msg)}</span>${opts.undo ? '<button type="button">Undo</button>' : ''}`;
  root.appendChild(el); toastEl = el;
  if (opts.undo) el.querySelector('button').addEventListener('click', () => { opts.undo(); dismissToast(el); });
  wireToast(el);
  clearTimeout(toastT); toastT = setTimeout(() => dismissToast(el), opts.undo ? 5000 : 2600);
}
function dismissToast(el, thrown) {
  if (!el || el._gone) return;
  el._gone = true;
  if (toastEl === el) { toastEl = null; clearTimeout(toastT); }
  if (still()) { el.remove(); return; }
  if (!thrown) el.classList.add('leaving');
  setTimeout(() => el.remove(), dur('exit') + 40);
}
function wireToast(el) {
  let g = null;
  el.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    el.setPointerCapture(e.pointerId);
    g = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, dy: 0, on: false };
  });
  el.addEventListener('pointermove', (e) => {
    if (!g || g.id !== e.pointerId) return;
    g.dx = e.clientX - g.x; g.dy = Math.max(0, e.clientY - g.y);
    if (!g.on && Math.max(Math.abs(g.dx), g.dy) < 6) return;
    if (!g.on) { g.on = true; el.style.animation = 'none'; el.style.transition = 'none'; }
    el.style.transform = `translate(${g.dx}px, ${g.dy}px)`;
    el.style.opacity = String(1 - Math.min(0.6, Math.max(Math.abs(g.dx), g.dy) / 200));
  });
  const up = (e) => {
    if (!g || g.id !== e.pointerId) return;
    const d = g; g = null;
    if (!d.on) { if (e.type === 'pointerup') dismissToast(el); return; }
    if (e.type === 'pointerup' && Math.max(Math.abs(d.dx), d.dy) > 44) {
      const side = Math.abs(d.dx) > d.dy;
      el.style.transition = still() ? 'none' : `transform ${dur('exit')}ms ${EXIT_EASE}, opacity ${dur('exit')}ms ${EXIT_EASE}`;
      el.style.transform = side ? `translateX(${Math.sign(d.dx) * (el.offsetWidth + 40)}px)` : `translateY(${d.dy + 60}px)`;
      el.style.opacity = '0';
      dismissToast(el, true);
    } else {
      el.style.transition = `transform ${dur('slide')}ms ${EASE.slide}, opacity ${dur('slide')}ms ${EASE.slide}`;
      el.style.transform = ''; el.style.opacity = '';
    }
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
}

function markPaid(pid, amount, how) {

function sheetToggle(pid) {
  const s = sheet, it = T.items.find((x) => x.id === s.i);
  const had = it.slots[0].includes(pid);
  it.slots[0] = had ? it.slots[0].filter((x) => x !== pid) : [...it.slots[0], pid];
  if (pid === me) touched.set(it.id, { cls: had ? 'erase' : 'draw', at: performance.now() });
  s.pop = { p: pid, at: performance.now() };
  tapped(); update();
}
function sheetStep(a, pid) {
  const it = T.items.find((x) => x.id === sheet.i);
  const sl = it.slots;
  if (a === 's-inc') {
    const k = sl.findIndex((x) => !x.length);
    if (k < 0) { toast(`All ${it.qty} are taken. Lower someone first.`); return; }
    if (pid === me) changeSlot(it, k, () => { sl[k] = [pid]; }); else { sl[k] = [pid]; touched.set(it.id, { cls: 'bump', k, at: performance.now() }); }
  } else {
    let k = -1;

    if (k < 0) sl.forEach((x, n) => { if (x.includes(pid)) k = n; });
    if (k < 0) return;
    const go2 = () => { sl[k] = sl[k].filter((x) => x !== pid); };
    if (pid === me) changeSlot(it, k, go2); else go2();
  }
  tapped(); update();
}

  });
}
function savePrefs() { try { localStorage.setItem('tab-proto-p', JSON.stringify(P)); } catch (e) { /* private mode */ } }
function paintPrefs() { $('#pMotion').setAttribute('aria-pressed', String(P.motion)); $('#pSlow').setAttribute('aria-pressed', String(P.slow > 1)); }
$('#pMotion').addEventListener('click', () => {
  P.motion = !P.motion; savePrefs(); installMotion(); paintPrefs();
  toast(P.motion ? 'Motion on' : 'Motion off: this is how Tab feels today');
});
$('#pSlow').addEventListener('click', () => { P.slow = P.slow > 1 ? 1 : 4; savePrefs(); installMotion(); paintPrefs(); toast(P.slow > 1 ? 'Slow motion: everything at a quarter speed' : 'Normal speed'); });
$('#pNotes').addEventListener('click', () => openSheet({ type: 'notes' }));

/* Feedback saves to the page's shared store (so Claude can read it back), and to this device as a fallback. */
const FB = { votes: {}, notes: {} };
let fbDoc = null, fbMode = 'local', fbWriting = false, fbAgain = false, fbT = null;
try { const s = JSON.parse(localStorage.getItem('tab-proto-fb') || 'null'); if (s) { Object.assign(FB.votes, s.votes || {}); Object.assign(FB.notes, s.notes || {}); } } catch (e) { /* none */ }
function fbStatusText() {
  if (fbMode === 'shared') return 'Your marks and notes save to this page, so Claude can read them.';
  if (fbMode === 'error') return 'Couldn’t save to the page just now. Copy feedback and paste it into the chat instead.';
  return 'Your marks save on this device. Copy feedback and paste it into the chat to send them.';
}
function fbPaint() { const el = $('#fbStatus'); if (el) el.textContent = fbStatusText(); }
function fbSave() {
  try { localStorage.setItem('tab-proto-fb', JSON.stringify(FB)); } catch (e) { /* private mode */ }
  if (!fbDoc) return;
  clearTimeout(fbT); fbT = setTimeout(fbFlush, 700);
}
async function fbFlush() {
  if (!fbDoc) return;
  if (fbWriting) { fbAgain = true; return; }
  fbWriting = true;
  try { await fbDoc.set({ votes: Object.assign({}, FB.votes), notes: Object.assign({}, FB.notes), updatedAt: new Date().toISOString() }); fbMode = 'shared'; }
  catch (e) { fbMode = 'error'; }
  finally { fbWriting = false; fbPaint(); if (fbAgain) { fbAgain = false; fbFlush(); } }
}
async function fbConnect() {
  const c = window.claude;
  if (!c || !c.use) return;
  try {
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc('feedback/' + id);
    const snap = await ref.get();
    const hadLocal = Object.keys(FB.votes).length || Object.keys(FB.notes).length;
    if (snap.exists) {
      const d = snap.data() || {};
      Object.assign(FB.votes, Object.assign({}, d.votes || {}, FB.votes));
      Object.assign(FB.notes, Object.assign({}, d.notes || {}, FB.notes));
    }
    fbDoc = ref; fbMode = 'shared'; fbPaint();
    if (hadLocal) fbSave();
    if (sheet && sheet.type === 'notes') { sheetBody._n = null; renderSheet(); }
  } catch (e) { fbMode = 'local'; fbPaint(); }
}
function vote(b) {
  const id = b.dataset.id, v = b.dataset.v;
  if (FB.votes[id] === v) delete FB.votes[id]; else FB.votes[id] = v;
  b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(FB.votes[id] === x.dataset.v)));
  fbSave();
}
function feedbackText() {
  const lines = ['Tab prototype feedback'];
  [...PATTERNS, ...OWN].forEach((p) => {
    const v = FB.votes[p.id], n = (FB.notes[p.id] || '').trim();
    if (v || n) lines.push(`${p.n}. ${p.t}: ${v ? VLABEL[v] : 'no mark'}${n ? `. ${n}` : ''}`);
  });
  if ((FB.notes.general || '').trim()) lines.push(`Anything else: ${FB.notes.general.trim()}`);
  if (lines.length === 1) lines.push('No marks yet.');
  return lines.join('\n');
}
function copyFeedback() {
  const text = feedbackText();
  const fallback = () => { const ta = $('#fbCopy'); if (!ta) return; ta.hidden = false; ta.value = text; ta.focus(); ta.select(); toast('Select all and copy it from the box'); };
  try { navigator.clipboard.writeText(text).then(() => toast('Feedback copied. Paste it into the chat.'), fallback); } catch (e) { fallback(); }
}

/* =====================================================================
   Start: the demo tab, at the screen a friend sees first
   ===================================================================== */
demoTab();
paintPrefs();
render();
fbConnect();
</script>
</body></html>
