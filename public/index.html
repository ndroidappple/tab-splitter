<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tab</title>
<meta name="description" content="Split a tab: everyone claims what they had and pays the payer back.">
<meta name="theme-color" content="#E9ECF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171C" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
<style>
:root{
  --bg:#E9ECF1; --card:#FFFFFF; --ink:#1B1D24; --muted:#5D6373; --line:#D6DAE2; --field:#EEF0F4;
  --warn:#B3261E; --warn-soft:#FBE7E5; --ok:#17703F; --ok-soft:#E1F2E8;
  --btn:#1B1D24; --btn-ink:#FFFFFF; --me:#2F5BD3;
  /* Springs (motion.mjs sets the real curves); these hold until it runs. */
  --enter:cubic-bezier(.16,1,.3,1); --enter-ms:375ms; --pop:cubic-bezier(.2,1.5,.4,1); --pop-ms:486ms;
  --slide:cubic-bezier(.3,1.3,.5,1); --slide-ms:371ms; --surface:cubic-bezier(.2,1,.3,1); --surface-ms:486ms;
  --exit:cubic-bezier(.4,0,1,1); --exit-ms:200ms;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15171C; --card:#1F2229; --ink:#F1F2F5; --muted:#A2A8B6; --line:#343844; --field:#282C34;
    --warn:#F2867C; --warn-soft:#3B1F1D; --ok:#5ACB8E; --ok-soft:#18322A;
    --btn:#F1F2F5; --btn-ink:#15171C;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button,a{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--me);outline-offset:2px}
[hidden]{display:none!important}
.money{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{position:sticky;top:0;z-index:4;padding-top:env(safe-area-inset-top);background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:56px}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.brand strong{font-size:19px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand span{font-size:13.5px;color:var(--muted)}
.chip-btn{display:inline-flex;align-items:center;gap:8px;max-width:50%;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px 4px 4px;min-height:40px;font-weight:650;font-size:14px;cursor:pointer}
.chip-btn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.netbar{max-width:560px;margin:10px auto 0;padding:8px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:600;width:calc(100% - 32px)}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 0}

h1{font-size:28px;margin:8px 0 6px;letter-spacing:-.02em;line-height:1.15}
h2{font-size:18px;margin:18px 0 8px}
.lede{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:16px}
.note{color:var(--muted);font-size:14px;margin:8px 2px 0}
.banner{border-radius:12px;padding:10px 12px;font-size:14.5px;font-weight:600;margin:0 0 12px;background:var(--field)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}

.btn{min-height:48px;padding:0 18px;border-radius:14px;border:0;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;text-align:center;gap:8px}
.btn.wide{width:100%}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:40px;padding:0 12px;font-size:14.5px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--me);font-weight:650;padding:10px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.stack{display:flex;flex-direction:column;gap:10px}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2 > *{flex:1}

label.f{display:block;font-weight:650;font-size:14.5px;margin:12px 0 6px}
.in{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:16px}
.in.money{text-align:right}
.items-edit{display:flex;flex-direction:column;gap:8px}
.ie{display:grid;grid-template-columns:1fr 52px 92px 40px;gap:6px;align-items:center}
.ie .in{min-height:44px;padding:0 8px}
.ie .x{width:40px;height:44px;border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;border-radius:10px}
.ie-head{display:grid;grid-template-columns:1fr 52px 92px 40px;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600;padding:0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--field);border-radius:999px;padding:4px 4px 4px 12px;font-weight:600;font-size:14.5px}
.chip button{border:0;background:none;width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:18px}
.choice{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;margin-bottom:8px}
.choice input{margin-top:4px;width:20px;height:20px}
.choice b{display:block}
.choice span{color:var(--muted);font-size:14px}

.av{width:28px;height:28px;border-radius:50%;background:var(--pc);color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.av.lg{width:40px;height:40px;font-size:17px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:16px}
.name-btn{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 9px;border:1px solid var(--line);background:var(--card);border-radius:14px;cursor:pointer;text-align:left;min-height:60px;font-weight:700;font-size:16px}

.seg{display:flex;background:var(--field);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:650;font-size:15px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(20,22,30,.14)}
.rows{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:4px;padding-right:4px;border-top:1px solid var(--line);position:relative;min-height:60px}
.rows .row:first-child{border-top:0}
.row.mine{background:color-mix(in srgb,var(--me) 9%,var(--card))}
.row.mine::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--me)}
.r-main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:10px 0 10px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.r-name{font-weight:650;font-size:16px;line-height:1.25}
.r-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13.5px;color:var(--muted)}
.r-meta em{font-style:normal;color:var(--warn);font-weight:650}
.r-meta b{color:var(--ink)}
.r-meta .tag{color:var(--me);font-weight:650}
.tick{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;color:transparent;padding:0}
.tick[aria-pressed="true"]{background:var(--me);border-color:var(--me);color:#fff}
.plus{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;font-size:24px;color:var(--muted);cursor:pointer;padding:0;line-height:1}
.step{display:inline-flex;align-items:center;background:var(--me);color:#fff;border-radius:999px;height:44px}
.step button{width:40px;height:44px;border:0;background:none;color:#fff;font-size:22px;font-weight:700;cursor:pointer;padding:0}
.step output{min-width:18px;text-align:center;font-weight:800}
.more{width:40px;height:48px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:10px;font-size:22px;padding:0}
.lines{list-style:none;padding:0;margin:0}
.lines li{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:6px 0;border-bottom:1px dotted var(--line)}
.lines li.tot{font-weight:800;border-bottom:0}
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.prow .grow{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{width:44px;height:44px;border:0;background:transparent;font-size:20px;cursor:pointer;padding:0}
.stepper button:disabled{opacity:.3}
.stepper output{min-width:26px;text-align:center;font-weight:700}
.person{border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.person > summary{display:flex;align-items:center;gap:10px;padding:12px 0;cursor:pointer;list-style:none}
.person > summary::-webkit-details-marker{display:none}
.p-name{flex:1;min-width:0;display:flex;flex-direction:column}
.p-name b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-name small{color:var(--muted);font-size:13.5px}
.p-name small.due{color:var(--warn);font-weight:650}
.p-name small.done{color:var(--ok);font-weight:650}
.p-body{padding:0 0 14px 38px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.bar{height:8px;border-radius:99px;background:var(--field);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.dock-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.dock-sum{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.dock-sum span{font-size:13.5px;color:var(--muted)}
.dock-sum strong{font-size:26px;font-weight:800}
.dock-sum small{font-size:13px;color:var(--muted)}

/* Sheets rise from the bottom edge on the surface spring, follow a drag down, and slide away however
   they close. The dialog covers the screen; the wrap follows the part the keyboard leaves visible. */
dialog.sheet{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;border:0;padding:0;background:transparent;color:var(--ink);overflow:hidden}
dialog.sheet::backdrop{background:transparent}
.sheet-wrap{position:absolute;left:0;right:0;top:var(--vv-top,0px);height:var(--vv-h,100%);display:flex;align-items:flex-end;justify-content:center;transition:height 300ms cubic-bezier(.38,.7,.125,1)}
.scrim{position:absolute;inset:0;background:rgba(8,10,14,.5)}
.sheet-panel{position:relative;width:100%;max-width:560px;max-height:min(90vh,calc(100% - env(safe-area-inset-top) - 12px));display:flex;flex-direction:column;background:var(--card);border-radius:20px 20px 0 0;outline:none}
.sheet-panel.dragging{will-change:transform}
.grab{flex:none;width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
#sheetBody{min-height:0;overflow-y:auto;overscroll-behavior:contain}
.sh{padding:10px 16px calc(18px + env(safe-area-inset-bottom))}
.sh h2{margin:0 0 4px;font-size:21px}
.sh .sub{color:var(--muted);margin:0 0 12px;font-size:14.5px}
.sh-foot{display:flex;flex-direction:column;gap:8px;margin-top:14px}

.group{display:flex;align-items:center;gap:8px;font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:20px 4px 8px}
.count{font-size:13px;font-weight:800;border-radius:999px;padding:1px 9px;background:var(--field);color:var(--ink);letter-spacing:0}
.count.warn{background:var(--warn-soft);color:var(--warn)}
.count.ok{background:var(--ok-soft);color:var(--ok)}
.st{font-weight:700}
.st.warn{color:var(--warn)}
.st.ok{color:var(--ok)}
.who{color:var(--ink);font-weight:600}
.banner.edit{display:flex;align-items:center;justify-content:space-between;gap:10px;background:color-mix(in srgb,var(--me) 14%,var(--card));color:var(--ink);position:sticky;top:64px;z-index:3}
.card.attention{border-color:var(--warn);box-shadow:inset 4px 0 0 var(--warn)}
.person-card{margin-bottom:0}
.person-card.due{box-shadow:inset 4px 0 0 var(--warn)}
.person-card.done{box-shadow:inset 4px 0 0 var(--ok)}
.pc-head{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;min-height:44px;border-radius:10px}
.pc-head::-webkit-details-marker{display:none}
.chev{width:9px;height:9px;flex:none;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin:0 4px 4px 2px;opacity:.6;transition:transform var(--slide-ms) var(--slide)}
.pc[open] .chev{transform:rotate(225deg);margin-bottom:-4px}
.pc-total{font-size:18px}
.mini-items{list-style:none;padding:0;margin:10px 0 0 38px;font-size:14.5px}
.mini-items li{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.more-acts{display:inline-block}
.more-acts > summary{list-style:none}
.more-acts > summary::-webkit-details-marker{display:none}
.more-acts[open]{display:block;width:100%}
.row.slotted{flex-direction:column;align-items:stretch;gap:0}
.row-top{display:flex;align-items:center;gap:4px;padding-right:4px}
.slots{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px 12px 14px;align-items:center}
.slot{width:40px;height:40px;border-radius:50%;padding:0;font-weight:800;font-size:15px;cursor:pointer;display:grid;place-items:center}
.slot.open{border:2px dashed var(--line);background:transparent;color:var(--muted);font-size:20px;font-weight:600}
.slot.taken{border:0;background:var(--pc);color:#fff;opacity:.55}
.slot.mine{border:3px solid var(--card);background:var(--pc);color:#fff;box-shadow:0 0 0 2px var(--pc)}
.slot:disabled{cursor:default}
.slot.shared{font-size:12.5px;letter-spacing:-.02em}
.slot.picked{outline:3px solid var(--ink);outline-offset:2px}
.sheet-slots{padding:0 0 12px}
.sheet-h{font-size:15px;margin:14px 0 4px}
.slot-extra{color:var(--warn);font-weight:700;font-size:13.5px}
/* Toast: a small pill that rises over the dock. Tap it or swipe it away; Undo is plain text. */
#toasts{position:fixed;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));z-index:20;display:flex;justify-content:center;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;position:absolute;bottom:0;width:max-content;max-width:min(528px,calc(100% - 32px));display:flex;align-items:center;gap:4px;min-height:44px;padding:2px 4px 2px 16px;border-radius:22px;background:var(--ink);color:var(--bg);box-shadow:0 6px 18px rgba(0,0,0,.16);touch-action:none;-webkit-user-select:none;user-select:none;animation:rise var(--enter-ms) var(--enter) both}
.toast .msg{font-weight:600;font-size:14.5px;line-height:1.3;padding:9px 12px 9px 0}
.toast button{flex:none;min-height:40px;padding:0 13px;border:0;background:none;color:inherit;font-weight:800;font-size:14.5px;border-left:1px solid color-mix(in srgb,var(--bg) 25%,transparent);border-radius:0 18px 18px 0;cursor:pointer}
.toast.leaving{animation:sink var(--exit-ms) var(--exit) forwards;pointer-events:none}
@keyframes rise{from{transform:translateY(40px);opacity:.4}}
@keyframes sink{to{transform:translateY(28px);opacity:0}}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--me);animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
/* Presses: a finger going down lands almost at once; letting go springs back on the pop spring,
   so a tap reads as a press and a release. Rows and cards shade instead of shrinking. */
:is(.btn,.chip-btn,.name-btn,.tick,.plus,.slot,.more,.x,.link,.chip button,.seg button,.stepper button,.step button){transition:transform var(--pop-ms) var(--pop),background-color 140ms,color 140ms}
:is(.chip-btn,.tick,.plus,.slot,.more,.x,.chip button,.seg button,.stepper button,.step button):active:not(:disabled){transform:scale(.94);transition-duration:70ms;transition-timing-function:ease-out}
:is(.btn,.name-btn):active:not(:disabled){transform:scale(.97);transition-duration:70ms;transition-timing-function:ease-out}
.link:active{opacity:.6}
:is(.r-main,.pc-head,.choice,.person > summary){transition:background-color 180ms}
:is(.r-main,.pc-head,.choice,.person > summary):active{background-color:color-mix(in srgb,var(--ink) 6%,transparent);transition-duration:60ms}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><strong id="title">Split a tab</strong><span id="subtitle" class="money"></span></div>
    <button id="meBtn" class="chip-btn" type="button" hidden></button>
  </div>
</header>
<div id="netbar" class="netbar" role="status" hidden>Can’t reach the tab right now. Your taps will save when you’re back online.</div>
<main class="wrap" id="app"><p class="muted" role="status">Loading…</p></main>
<div class="dock" id="dock" hidden><div class="dock-in" id="dockIn"></div></div>
<dialog id="sheet" class="sheet" aria-labelledby="sheetTitle"><div class="sheet-wrap" id="sheetWrap"><div class="scrim" id="scrim"></div>
  <div class="sheet-panel" id="sheetPanel" tabindex="-1"><div class="grab" aria-hidden="true"></div><div id="sheetBody"></div></div></div></dialog>
<div id="toasts" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">This page needs JavaScript turned on.</p></noscript>
<script type="module" src="/app.mjs"></script>
</body>
</html>
